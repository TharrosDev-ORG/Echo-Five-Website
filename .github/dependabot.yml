version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per week for everything that should be safe.
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors that need a deliberate migration; bump these by hand.
      # @types/node tracks the runtime (Node 22, see .nvmrc / engines).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
